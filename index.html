<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Hertavernello — Fantalega</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="gate" class="gate">
    <img src="assets/logo.png" class="gate-logo" alt="Hertavernello">
    <h1>Hertavernello</h1>
    <p>Solo per fantallenatori. Inserisci la password.</p>
    <input type="password" id="gate-input" placeholder="Password" autocomplete="off">
    <button id="gate-btn">Entra</button>
    <p id="gate-error" class="gate-error"></p>
  </div>

  <div id="app" class="app hidden">
    <header class="site-header">
      <img src="assets/logo.png" class="logo" alt="">
      <div>
        <h1 id="lega-nome">Hertavernello</h1>
        <p id="lega-stagione" class="muted"></p>
      </div>
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="squadre.html">Squadre</a>
        <a href="#" id="hv-esci" title="Esci e cambia utente">Esci</a>
      </nav>
    </header>

    <section class="hero">
      <p id="countdown" class="countdown"></p>
    </section>

    <section class="section">
      <h2>Chi gioca contro chi</h2>
      <div id="incrocio-wrap" class="incrocio-wrap"></div>
    </section>

    <section class="section">
      <h2>Classifica generale previsioni</h2>
      <div id="leaderboard-wrap"></div>
    </section>

    <section class="section">
      <h2>Classifica Serie A</h2>
      <div id="classifica-wrap"></div>
    </section>

    <section class="section">
      <h2>Top marcatori</h2>
      <div id="marcatori-wrap"></div>
    </section>

    <footer class="site-footer">
      HertaVernello · aggiornato a mano da chi ha già perso il fanta - © Emmanuele Tufano - Tutti i diritti riservati.
    </footer>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
