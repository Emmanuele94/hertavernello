<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Squadre — Hertavernello</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="gate" class="gate">
    <img src="assets/logo.png" class="gate-logo" alt="Hertavernello">
    <h1>Hertavernello</h1>
    <p>Solo per fantallenatori. Inserisci la password.</p>
    <input type="password" id="gate-input" placeholder="Password" autocomplete="off">
    <button id="gate-btn">Entra</button>
    <p id="gate-error" class="gate-error"></p>
  </div>

  <div id="app" class="app hidden">
    <header class="site-header">
      <img src="assets/logo.png" class="logo" alt="">
      <div>
        <h1 id="lega-nome">Hertavernello</h1>
      </div>
      <nav>
        <a href="index.html"><img src="assets/icone/icon-house.png" class="icona-nav" alt="">Home</a>
        <a href="squadre.html" class="active"><img src="assets/icone/icon-teams.png" class="icona-nav" alt="">Squadre</a>
        <a href="#" id="hv-esci" title="Esci e cambia utente">Esci</a>
      </nav>
    </header>

    <section class="section" style="margin-top: 10px;">
      <div id="tabs" class="tabs"></div>

      <div class="squadra-intestazione">
        <div id="squadra-logo-wrap" class="squadra-logo-wrap"></div>
        <div class="squadra-intestazione-testo">
          <h2 id="squadra-nome-grande"></h2>
          <div id="squadra-logo-upload-admin"></div>
        </div>
      </div>

      <div class="squadre-layout">
        <div class="squadra-block" style="margin: 0;">
          <h3 class="squadra-block-title">Rosa</h3>
          <div id="roster-content" class="roster-groups"></div>
        </div>

        <div class="squadre-sidebar">
          <div class="squadra-block" style="margin: 0 0 26px;">
            <h3 class="squadra-block-title"><img src="assets/icone/icon-pagella.png" class="icona-titolo" alt="">Pagella</h3>
            <div id="pagella-content"></div>
          </div>

          <div class="squadra-block" style="margin: 0;">
            <h3 class="squadra-block-title"><img src="assets/icone/icon-predict.png" class="icona-titolo" alt="">Previsione Serie A</h3>
            <div id="previsione-content"></div>
            <div id="previsione-upload-admin"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="lightbox" class="lightbox-overlay hidden" onclick="this.classList.add('hidden')">
    <img id="lightbox-img" src="" alt="Previsione ingrandita">
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/github-api.js"></script>
  <script src="js/squadre.js"></script>
</body>
</html>
