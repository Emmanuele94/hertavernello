<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Squadre — Hertavernello</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icone-app/icon-180.png">
  <meta name="theme-color" content="#7A0E1F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260914-mobile2">
<link rel="stylesheet" href="css/restyling.css?v=20260919-pagellashare1">
<script defer src="js/restyling-ui.js?v=20260914-mobile2"></script>
<script defer src="js/site-tools.js?v=20260915-crosshost1"></script>
<script defer src="js/admin-icone-home.js?v=20260914-mobile2"></script>
</head>
<body>

  <div id="gate" class="gate">
    <img src="assets/logo.png" class="gate-logo" alt="Hertavernello">
    <h1>Hertavernello</h1>
    <p>Solo per fantallenatori. Inserisci la password.</p>
    <input type="password" id="gate-input" placeholder="Password" autocomplete="off">
    <button id="gate-btn">Entra</button>
    <p id="gate-error" class="gate-error"></p>
  </div>

  <div id="app" class="app hidden">
    <header class="site-header">
      <img src="assets/logo.png" class="logo" alt="">
      <div class="site-header-testo">
        <h1 id="lega-nome">Hertavernello</h1>
      </div>
      <a href="quiz.html" class="quiz-badge-link" title="Mini-Quiz">
        <img src="assets/icone/icon-quiz.png" class="quiz-badge-icona" alt="Quiz">
      </a>
      <nav>
        <a href="index.html" class="nav-btn"><img src="assets/icone/icon-house.png" class="icona-nav" alt="">Home</a>
        <a href="squadre.html" class="nav-btn active"><img src="assets/icone/icon-teams.png" class="icona-nav" alt="">Squadre</a>
        <a href="archivio.html" class="nav-btn"><img src="assets/icone/icon-archivio.png" class="icona-nav" alt="">Archivio</a>
        <a href="#" id="hv-apri-regolamento" class="nav-btn"><img src="assets/icone/icon-regolamento.png" class="icona-nav" alt="">Regolamento</a>
        <a href="admin.html" id="nav-admin-link" class="nav-btn hidden">Admin</a>
        <a href="#" id="hv-esci" class="nav-exit-link" title="Esci e cambia utente">
          <img src="assets/icone/icon-exit.png" class="nav-exit-icona" alt="Esci">
        </a>
      </nav>
    </header>

    <section class="section" style="margin-top: 10px;">
      <div class="rosa-search" id="rosa-search-wrap">
        <label class="rosa-search-label" for="rosa-search-input">Cerca giocatore o fantasquadra</label>
        <div class="rosa-search-box">
          <span class="rosa-search-icon" aria-hidden="true">⌕</span>
          <input
            type="search"
            id="rosa-search-input"
            class="rosa-search-input"
            placeholder="Cerca un giocatore o una fantasquadra…"
            autocomplete="off"
            spellcheck="false"
            aria-autocomplete="list"
            aria-controls="rosa-search-results"
            aria-expanded="false"
          >
          <button type="button" id="rosa-search-clear" class="rosa-search-clear hidden" aria-label="Cancella ricerca">✕</button>
        </div>
        <div id="rosa-search-results" class="rosa-search-results hidden" role="listbox" aria-label="Risultati ricerca"></div>
      </div>

      <div id="tabs" class="tabs"></div>

      <div class="squadra-intestazione">
        <div id="squadra-logo-wrap" class="squadra-logo-wrap"></div>
        <div class="squadra-intestazione-testo">
          <h2 id="squadra-nome-grande"></h2>
          <a id="pagella-page-link" class="pagella-mini-badge" href="pagella.html">📝 Pagella</a>
          <div id="squadra-logo-upload-admin"></div>
        </div>
        <div id="squadra-logo-piccolo-posizione-wrap" class="squadra-logo-piccolo-posizione-wrap"></div>
      </div>

      <div id="squadra-badge-wrap" class="squadra-badge-wrap"></div>

      <div class="squadre-layout">
        <div class="squadra-block" style="margin: 0;">
          <h3 class="squadra-block-title sezione-toggle rosa-title-row" data-target="rosa-blocco-contenuto">
            <span class="rosa-title-label">Rosa</span>
            <button type="button" id="toggle-info-match" class="toggle-info-btn" aria-expanded="false" title="Mostra o nascondi le partite della giornata">INFO</button>
            <span class="toggle-chevron">▾</span>
          </h3>
          <div id="rosa-blocco-contenuto" class="sezione-contenuto">
            <p id="info-match-stato" class="muted" style="font-size:11.5px; margin: -10px 0 12px;"></p>
            <div id="roster-content" class="roster-groups"></div>
          </div>
          <div id="squadra-mercato-wrap"></div>
        </div>

        <div class="squadre-sidebar">
          <div class="squadra-block" style="margin: 0;">
            <h3 class="squadra-block-title sezione-toggle" data-target="previsione-blocco-contenuto">
              <img src="assets/icone/icon-predict.png" class="icona-titolo" alt="">Previsione Serie A
              <span class="toggle-chevron">▾</span>
            </h3>
            <div id="previsione-blocco-contenuto" class="sezione-contenuto">
              <div id="previsione-content"></div>
              <div id="previsione-upload-admin"></div>
            </div>
          </div>

          <div class="squadra-block" style="margin: 26px 0 0;">
            <h3 class="squadra-block-title sezione-toggle" data-target="torta-squadre-blocco-contenuto">
              <img src="assets/icone/icon-teamsoccer.png" class="icona-titolo" alt="">Composizione rosa
              <span class="toggle-chevron">▾</span>
            </h3>
            <div id="torta-squadre-blocco-contenuto" class="sezione-contenuto">
              <div id="torta-squadre-content"></div>
            </div>
          </div>

          <div class="squadra-block" style="margin: 26px 0 0;">
            <h3 class="squadra-block-title sezione-toggle" data-target="torta-nazioni-blocco-contenuto">
              <img src="assets/icone/icon-world.png" class="icona-titolo" alt="">Da dove arriva la tua squadra
              <span class="toggle-chevron">▾</span>
            </h3>
            <div id="torta-nazioni-blocco-contenuto" class="sezione-contenuto">
              <div id="torta-nazioni-content"></div>
            </div>
          </div>

          <div class="squadra-block" style="margin: 26px 0 0;">
            <h3 class="squadra-block-title sezione-toggle" data-target="highlights-blocco-contenuto">
              <img src="assets/icone/icon-highlights.png" class="icona-titolo" alt="">Highlights
              <span class="toggle-chevron">▾</span>
            </h3>
            <div id="highlights-blocco-contenuto" class="sezione-contenuto">
              <div id="highlights-content"></div>
              <div id="highlights-admin-form"></div>
            </div>
          </div>

          <div class="squadra-block" style="margin: 26px 0 0;">
            <h3 class="squadra-block-title sezione-toggle" data-target="audio-squadra-blocco-contenuto">
              <img src="assets/icone/icon-audiostorici.png" class="icona-titolo" alt="">Audio
              <span class="toggle-chevron">▾</span>
            </h3>
            <div id="audio-squadra-blocco-contenuto" class="sezione-contenuto">
              <div id="audio-squadra-content"></div>
              <div id="audio-squadra-admin-form"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="lightbox" class="lightbox-overlay hidden" onclick="this.classList.add('hidden')">
    <img id="lightbox-img" src="" alt="Previsione ingrandita">
  </div>


  <div id="regolamento-overlay" class="regolamento-overlay hidden">
    <div class="regolamento-pannello">
      <div class="regolamento-intestazione">
        <p class="regolamento-titolo">Regolamento</p>
        <a href="assets/regolamento.pdf" download="Regolamento.pdf" class="regolamento-azione regolamento-scarica">⬇ Scarica</a>
        <a href="assets/regolamento.pdf" target="_blank" rel="noopener" class="regolamento-azione regolamento-apri-scheda">Apri in un'altra scheda</a>
        <button type="button" id="regolamento-chiudi" class="regolamento-chiudi" aria-label="Chiudi">✕</button>
      </div>
      <div id="regolamento-corpo" class="regolamento-corpo"></div>
    </div>
  </div>

  <script src="js/versione-check.js?v=20260914-mobile2"></script>
  <script src="js/auth.js?v=20260914-mobile2"></script>
  <script src="js/regolamento-modal.js?v=20260914-mobile2"></script>
  <script src="js/api.js?v=20260916-adminmarket1"></script>
  <script src="js/cache.js?v=20260914-mobile2"></script>
  <script src="js/giocatori.js?v=20260916-adminmarket1"></script>
  <script src="js/calcolo-derivati.js?v=20260914-mobile2"></script>
  <script src="js/github-api.js?v=20260914-mobile2"></script>
  <script src="js/squadre.js?v=20260919-pagellashare1"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw-restyling.js", { updateViaCache: "none" }).catch(() => {});
      });
    }
  </script>
</body>
</html>
