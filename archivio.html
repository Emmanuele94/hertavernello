<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Archivio — Hertavernello</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icone-app/icon-180.png">
  <meta name="theme-color" content="#7A0E1F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="gate" class="gate">
    <img src="assets/logo.png" class="gate-logo" alt="Hertavernello">
    <h1>Hertavernello</h1>
    <p>Solo per fantallenatori. Inserisci la password.</p>
    <input type="password" id="gate-input" placeholder="Password" autocomplete="off">
    <button id="gate-btn">Entra</button>
    <p id="gate-error" class="gate-error"></p>
  </div>

  <div id="app" class="app hidden">
    <header class="site-header">
      <img src="assets/logo.png" class="logo" alt="">
      <div class="site-header-testo">
        <h1 id="lega-nome">Hertavernello</h1>
      </div>
      <a href="quiz.html" class="quiz-badge-link" title="Mini-Quiz">
        <img src="assets/icone/icon-quiz.png" class="quiz-badge-icona" alt="Quiz">
      </a>
      <nav>
        <a href="index.html" class="nav-btn"><img src="assets/icone/icon-house.png" class="icona-nav" alt="">Home</a>
        <a href="squadre.html" class="nav-btn"><img src="assets/icone/icon-teams.png" class="icona-nav" alt="">Squadre</a>
        <a href="archivio.html" class="nav-btn active"><img src="assets/icone/icon-archivio.png" class="icona-nav" alt="">Archivio</a>
        <a href="#" id="hv-esci" class="nav-exit-link" title="Esci e cambia utente">
          <img src="assets/icone/icon-exit.png" class="nav-exit-icona" alt="Esci">
        </a>
      </nav>
    </header>

    <section class="section" style="margin-top: 10px;">
      <h2>Archivio stagioni</h2>
      <div class="torta-wip" style="max-width: 420px;">
        <img src="assets/icone/icon-workinprogress.png" class="torta-wip-icona" alt="">
        <p class="torta-wip-testo">In arrivo: l'albo d'oro di Hertavernello — rose, pagelle e previsioni di ogni stagione passata, con la classifica di chi ha vinto di più.</p>
      </div>
    </section>
  </div>

  <script src="js/auth.js"></script>
  <script>
    hv_checkGate();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
